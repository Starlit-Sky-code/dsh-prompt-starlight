# Copyright (c) 2026 Starlit Sky · SPDX-License-Identifier: AGPL-3.0-only
# https://github.com/Starlit-Sky-code/dsh-prompt-starlight
#
# 每次推送到 main 或提 PR 都跑一遍全部检查。
# 跑的就是本地那几条命令，所以「本地绿 = CI 绿」不会分叉。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连推多次时取消旧的那次；但 tag 上的运行永不取消（发版不能被打断）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # 只改了说明或截图时，没必要烧一轮完整测试。
  changes:
    name: 变更范围
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: scope
        name: 判断是否只有文档变更
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only --no-renames "$BASE" HEAD)
          echo "变更文件："
          echo "$CHANGED"
          # 只有说明、变更记录、docs、截图算「纯展示变更」
          if echo "$CHANGED" | grep -qvE '^(README[^/]*\.md|CHANGELOG[^/]*\.md|docs/.*|assets/screenshots/.*)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: 验证（Node.js ${{ matrix.node }}）
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # 与 package.json 的 engines.node（>=20）对齐：
      # 声明了就得真的在最低版本上跑过。
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # tools/fixture 是测试用的 React/jsdom 沙箱，不随包发布
      - name: 安装测试夹具
        run: npm install --prefix tools/fixture --no-audit --no-fund

      # 根依赖只有一个：官方市场索引校验器
      - name: 安装根依赖
        run: npm install --no-audit --no-fund

      - name: 署名头检查
        run: node tools/stamp-signature.mjs --check

      - name: 包形状与署名
        run: node tools/test-package.mjs

      - name: 宿主半部
        run: node tools/test-host.mjs

      - name: 浏览器半部
        run: node tools/test-client.mjs

      # 复刻宿主的 readPluginMeta 规则：图标相对路径、≤256 KiB、locale/exports
      - name: 插件卡片元数据（图标 + 本地化）
        run: node tools/check-plugin-meta.mjs

      - name: 市场索引格式 1 校验
        run: node tools/validate-market.mjs

      # 版本说明必须存在，否则发版会产出空 Release
      - name: 版本说明可生成
        run: node tools/extract-release-notes.mjs --current /tmp/notes.md

      # 防止 files[] 把不该发的图带进包（历史上就吃过大图亏）
      - name: 打包体积不超过 2 MB
        run: |
          npm pack --dry-run --json > /tmp/pack.json 2>/dev/null
          node -e '
            const fs = require("node:fs")
            const raw = fs.readFileSync("/tmp/pack.json", "utf8")
            const info = JSON.parse(raw.slice(raw.indexOf("[")))[0]
            const mb = info.unpackedSize / 1024 / 1024
            console.log(`解包体积 ${mb.toFixed(2)} MB，文件数 ${info.entryCount}`)
            if (mb > 2) {
              console.error("包超过 2 MB，检查 files[] 是否把不该发的图带进来了")
              process.exit(1)
            }
          '
