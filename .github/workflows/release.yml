# 星芒 · 提示词一键优化（dsh-prompt-starlight）
# Copyright (c) 2026 Starlit Sky · SPDX-License-Identifier: AGPL-3.0-only
# https://github.com/Starlit-Sky-code/dsh-prompt-starlight
#
# 推一个 v* tag 就发版：先跑全量检查 → 打 tgz → 建/更新 Release 并上传资产
# → 把市场索引重钉到这个 tag 的提交 →（可选）发布到 npm。
#
# 用法：
#   npm version 0.4.2 --no-git-tag-version   # 改版本号（同时要更新 lib/*.js 里的版本串）
#   git commit -am "chore: v0.4.2"
#   git tag v0.4.2 && git push origin main --tags
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（形如 v0.4.2）'
        required: true

permissions:
  contents: write
  # npm Trusted Publishing（OIDC 免密钥发布）要的就是这一条：
  # 工作流向 GitHub 要一个短期 OIDC 令牌，npm CLI 拿它换一次性的发布令牌。
  # 因此全程不需要任何长期 token / Bypass 2FA 的 Granular Access Token。
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # 关键：让 setup-node 往 .npmrc 写
          #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # 只给步骤加 NODE_AUTH_TOKEN 环境变量是不生效的——npm 不会自己读它。
          registry-url: 'https://registry.npmjs.org'

      # tag 必须是 vX.Y.Z，且与 package.json 的 version 完全一致。
      # 不一致就停下——否则会发出一个索引指向错误版本号的市场条目。
      - name: 校验版本一致性
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG，package.json=$PKG"
          if [ "$TAG" = "$VERSION" ]; then
            echo "::error::tag 必须以 v 开头（例如 v1.2.3）"
            exit 1
          fi
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::tag 版本 $VERSION 与 package.json 的 $PKG 不一致"
            exit 1
          fi

      - name: 安装测试夹具
        run: npm install --prefix tools/fixture --no-audit --no-fund

      - name: 安装根依赖
        run: npm install --no-audit --no-fund

      # 发版前必须全绿：不许发出未经测试的包
      - name: 署名头检查
        run: node tools/stamp-signature.mjs --check

      - name: 包形状与署名
        run: node tools/test-package.mjs

      - name: 宿主半部
        run: node tools/test-host.mjs

      - name: 浏览器半部
        run: node tools/test-client.mjs

      - name: 插件卡片元数据
        run: node tools/check-plugin-meta.mjs

      - name: 市场索引格式 1 校验
        run: node tools/validate-market.mjs

      - name: 打 tgz
        id: pack
        run: |
          npm pack --pack-destination . >/dev/null 2>&1
          TGZ=$(ls -1 dsh-prompt-starlight-*.tgz | head -n 1)
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"
          ls -l "$TGZ"

      # 版本说明从 CHANGELOG 里抽，而不是用 --generate-notes 把提交标题堆成列表：
      # 说明随代码一起评审（写在 CHANGELOG 的 diff 里），且缺该版本小节时本步直接失败，
      # 发版不会产出空说明。
      - name: 生成版本说明
        run: node tools/extract-release-notes.mjs "${{ steps.version.outputs.tag }}" /tmp/notes.md

      - name: 建或更新 Release 并上传资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TGZ="${{ steps.pack.outputs.tgz }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖资产与说明"
            gh release upload "$TAG" "$TGZ" --clobber
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" "$TGZ" --title "$TAG" --notes-file /tmp/notes.md
          fi

      # 把市场索引钉到本 tag 指向的提交。DSH 安装时按这个 40 位 commit 取源码，
      # 所以不重钉的话，用户从索引装到的还是上一个版本。
      - name: 重钉市场索引（提交到 main）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/pin-market.mjs "$GITHUB_SHA" "${{ steps.version.outputs.version }}"
          node tools/validate-market.mjs
          if git diff --quiet -- market/index.json; then
            echo "索引无需变更"
            exit 0
          fi
          git add market/index.json
          git commit -m "chore: 市场索引重新钉到 ${{ steps.version.outputs.tag }}（${GITHUB_SHA:0:7}）"
          git push origin HEAD:main

      # npm 发布走 Trusted Publishing（OIDC），不需要任何长期 token。
      #
      # 前置（在 npmjs.com 上做一次）：
      #   账号 → Trusted Publishers（或包设置页）→ Add trusted publisher
      #     Provider          : GitHub Actions
      #     Organization/user : Starlit-Sky-code
      #     Repository        : dsh-prompt-starlight
      #     Workflow filename : release.yml
      #     Environment       : 留空
      #     Allowed actions   : npm publish
      # 注意：新配置有 2 天有效期，必须在窗口内完成首次成功发布，否则作废需重建。
      #
      # 配好后到仓库 Settings → Secrets and variables → Actions → **Variables** 新建
      #   名称 NPM_PUBLISH，值 true
      # 这里用 variable 而不是 secret：变量可读、无泄漏风险，也方便随时关掉发布。
      - name: 发布到 npm（Trusted Publishing，需变量 NPM_PUBLISH=true）
        if: vars.NPM_PUBLISH == 'true'
        run: |
          # 防止重复发布：版本已在 registry 上就跳过
          if npm view "$(node -p "require('./package.json').name")@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "该版本已在 registry 上，跳过"
            exit 0
          fi
          # 没有 _authToken 也能发：npm CLI 检测到 GHA 的 OIDC 环境后
          # 会自动用 id-token 换一次性发布令牌，并附带 provenance 证明
          npm publish --no-audit --no-fund
