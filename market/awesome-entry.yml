url: https://github.com/Starlit-Sky-code/dsh-prompt-starlight
name: Starlit-Sky-code/dsh-prompt-starlight
category: ui
description:
  en: Adds a star button to the left of the composer that rewrites the draft into a more structured prompt, with two sliders for rewrite strength and detail, a model switcher, and 11 built-in rules that can be toggled.
  zh: 在输入框工具行左侧加一个四角星按钮，一键把草稿改写成更有结构的提示词；提供强度与详细度两根滑块、模型切换，以及 11 条可开关的内置规则。
